<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Banderquiz</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0c29">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Banderquiz">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <style>
        :root {
            --bg-start: #0f0c29;
            --bg-mid: #1a1a3a;
            --bg-end: #0a0a1a;
            --card-bg: rgba(22, 33, 62, 0.75);
            --accent: #e94560;
            --gold: #f5c518;
            --text: #f0f0f0;
            --muted: #b0b0c0;
            --radius-xl: 2.5rem;
            --radius-md: 1.8rem;
            --flag-size: clamp(5rem, 20vw, 10rem);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            min-height: 100vh;
            background: radial-gradient(ellipse at 30% 20%, var(--bg-start), var(--bg-mid) 60%, var(--bg-end));
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.8rem;
            color: var(--text);
        }
        .app-container { max-width: 700px; width: 100%; display: flex; flex-direction: column; gap: 1rem; }
        .portal { display: flex; flex-direction: column; align-items: center; gap: 1.2rem; text-align: center; animation: fadeSlideUp 0.6s ease-out; }
        .logo-wrapper { width: 100%; display: flex; justify-content: center; margin: 0.2rem 0; }
        .logo-img { width: clamp(160px, 40vw, 280px); max-width: 320px; height: auto; filter: drop-shadow(0 12px 28px rgba(0,0,0,0.5)) drop-shadow(0 0 12px rgba(245,197,24,0.3)); }
        .hero-question { font-size: 1.9rem; font-weight: 700; background: linear-gradient(135deg, #fff, #ffe6b3); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .invite-line { color: var(--muted); background: rgba(255,255,255,0.05); backdrop-filter: blur(4px); padding: 0.3rem 1.2rem; border-radius: 40px; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1.5rem; width: 100%; margin-top: 1rem; }
        .level-card { background: var(--card-bg); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.12); border-radius: var(--radius-xl); padding: 1.8rem 1rem; transition: all 0.3s; box-shadow: 0 20px 30px -12px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; gap: 0.9rem; cursor: pointer; }
        .level-card:hover { transform: translateY(-10px); border-color: var(--accent); background: rgba(233,68,96,0.2); box-shadow: 0 28px 40px -12px rgba(233,69,96,0.5); }
        .level-emoji { font-size: 3.3rem; }
        .level-name { font-weight: 800; font-size: 1.6rem; background: linear-gradient(145deg, #fff, #e0e0ff); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .level-desc { color: #cbcbe0; font-size: 0.9rem; background: rgba(0,0,0,0.3); padding: 0.2rem 0.8rem; border-radius: 30px; }
        .footer { color: #9b9bb0; font-size: 0.8rem; margin-top: 0.8rem; border-top: 1px dashed rgba(255,255,255,0.15); padding-top: 1.2rem; width: 80%; }
        @keyframes fadeSlideUp { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
        .game-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.8rem; background: var(--card-bg); backdrop-filter: blur(16px); border-radius: var(--radius-md); padding: 0.8rem 1.2rem; border: 1px solid rgba(255,255,255,0.12); }
        .header-left { display: flex; align-items: center; gap: 0.4rem; }
        .header-logo { width: 32px; height: auto; }
        .title { font-weight: 900; font-size: 1.1rem; background: linear-gradient(135deg, #f5c518, #ffaa00); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .scores span { background: rgba(255,255,255,0.08); border-radius: 3rem; padding: 0.25rem 0.8rem; margin: 0 0.2rem; font-weight: 700; }
        .btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 0.5rem 1rem; border-radius: 3rem; font-weight: 700; cursor: pointer; }
        .btn:hover { background: rgba(255,255,255,0.18); }
        .game-card { background: var(--card-bg); border-radius: var(--radius-xl); padding: 2rem 1.5rem; display: flex; flex-direction: column; align-items: center; gap: 1.2rem; border: 1px solid rgba(255,255,255,0.1); }
        .flag-container { background: rgba(0,0,0,0.35); border-radius: 2rem; padding: 1rem; }
        .flag-emoji { font-size: var(--flag-size); filter: drop-shadow(0 10px 20px black); }
        .answers-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.8rem; width: 100%; }
        .answer-btn { background: rgba(255,255,255,0.07); border: 2px solid rgba(255,255,255,0.15); color: #ddd; font-weight: 700; font-size: 1rem; padding: 0.9rem 0.5rem; border-radius: 1rem; cursor: pointer; transition: 0.2s; word-break: break-word; }
        .answer-btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .answer-btn.correct { background: #2ecc71 !important; border-color: #27ae60 !important; }
        .answer-btn.wrong { background: #e74c3c !important; border-color: #c0392b !important; }
        @media (max-width: 550px) { body { padding: 1rem; } .hero-question { font-size: 1.6rem; } .answers-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="app-container" id="app"></div>
    <script>
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

        // Base de datos de países (código CCA2, nombre en español)
        const RAW = [
            ["AD","Andorra"],["AE","Emiratos Árabes Unidos"],["AF","Afganistán"],["AG","Antigua y Barbuda"],["AI","Anguila"],["AL","Albania"],["AM","Armenia"],["AO","Angola"],["AQ","Antártida"],["AR","Argentina"],["AS","Samoa Americana"],["AT","Austria"],["AU","Australia"],["AW","Aruba"],["AX","Islas Åland"],["AZ","Azerbaiyán"],["BA","Bosnia y Herzegovina"],["BB","Barbados"],["BD","Bangladés"],["BE","Bélgica"],["BF","Burkina Faso"],["BG","Bulgaria"],["BH","Baréin"],["BI","Burundi"],["BJ","Benín"],["BL","San Bartolomé"],["BM","Bermudas"],["BN","Brunéi"],["BO","Bolivia"],["BQ","Caribe Neerlandés"],["BR","Brasil"],["BS","Bahamas"],["BT","Bután"],["BV","Isla Bouvet"],["BW","Botsuana"],["BY","Bielorrusia"],["BZ","Belice"],["CA","Canadá"],["CC","Islas Cocos"],["CD","República Democrática del Congo"],["CF","República Centroafricana"],["CG","Congo"],["CH","Suiza"],["CI","Costa de Marfil"],["CK","Islas Cook"],["CL","Chile"],["CM","Camerún"],["CN","China"],["CO","Colombia"],["CR","Costa Rica"],["CU","Cuba"],["CV","Cabo Verde"],["CW","Curazao"],["CX","Isla de Navidad"],["CY","Chipre"],["CZ","República Checa"],["DE","Alemania"],["DJ","Yibuti"],["DK","Dinamarca"],["DM","Dominica"],["DO","República Dominicana"],["DZ","Argelia"],["EC","Ecuador"],["EE","Estonia"],["EG","Egipto"],["EH","Sahara Occidental"],["ER","Eritrea"],["ES","España"],["ET","Etiopía"],["FI","Finlandia"],["FJ","Fiyi"],["FK","Islas Malvinas"],["FM","Micronesia"],["FO","Islas Feroe"],["FR","Francia"],["GA","Gabón"],["GB","Reino Unido"],["GD","Granada"],["GE","Georgia"],["GF","Guayana Francesa"],["GG","Guernsey"],["GH","Ghana"],["GI","Gibraltar"],["GL","Groenlandia"],["GM","Gambia"],["GN","Guinea"],["GP","Guadalupe"],["GQ","Guinea Ecuatorial"],["GR","Grecia"],["GS","Islas Georgias del Sur y Sandwich del Sur"],["GT","Guatemala"],["GU","Guam"],["GW","Guinea-Bisáu"],["GY","Guyana"],["HK","Hong Kong"],["HM","Islas Heard y McDonald"],["HN","Honduras"],["HR","Croacia"],["HT","Haití"],["HU","Hungría"],["ID","Indonesia"],["IE","Irlanda"],["IL","Israel"],["IM","Isla de Man"],["IN","India"],["IO","Territorio Británico del Océano Índico"],["IQ","Irak"],["IR","Irán"],["IS","Islandia"],["IT","Italia"],["JE","Jersey"],["JM","Jamaica"],["JO","Jordania"],["JP","Japón"],["KE","Kenia"],["KG","Kirguistán"],["KH","Camboya"],["KI","Kiribati"],["KM","Comoras"],["KN","San Cristóbal y Nieves"],["KP","Corea del Norte"],["KR","Corea del Sur"],["KW","Kuwait"],["KY","Islas Caimán"],["KZ","Kazajistán"],["LA","Laos"],["LB","Líbano"],["LC","Santa Lucía"],["LI","Liechtenstein"],["LK","Sri Lanka"],["LR","Liberia"],["LS","Lesoto"],["LT","Lituania"],["LU","Luxemburgo"],["LV","Letonia"],["LY","Libia"],["MA","Marruecos"],["MC","Mónaco"],["MD","Moldavia"],["ME","Montenegro"],["MF","San Martín"],["MG","Madagascar"],["MH","Islas Marshall"],["MK","Macedonia del Norte"],["ML","Mali"],["MM","Myanmar"],["MN","Mongolia"],["MO","Macao"],["MP","Islas Marianas del Norte"],["MQ","Martinica"],["MR","Mauritania"],["MS","Montserrat"],["MT","Malta"],["MU","Mauricio"],["MV","Maldivas"],["MW","Malaui"],["MX","México"],["MY","Malasia"],["MZ","Mozambique"],["NA","Namibia"],["NC","Nueva Caledonia"],["NE","Níger"],["NF","Isla Norfolk"],["NG","Nigeria"],["NI","Nicaragua"],["NL","Países Bajos"],["NO","Noruega"],["NP","Nepal"],["NR","Nauru"],["NU","Niue"],["NZ","Nueva Zelanda"],["OM","Omán"],["PA","Panamá"],["PE","Perú"],["PF","Polinesia Francesa"],["PG","Papúa Nueva Guinea"],["PH","Filipinas"],["PK","Pakistán"],["PL","Polonia"],["PM","San Pedro y Miquelón"],["PN","Islas Pitcairn"],["PR","Puerto Rico"],["PS","Palestina"],["PT","Portugal"],["PW","Palaos"],["PY","Paraguay"],["QA","Catar"],["RE","Reunión"],["RO","Rumania"],["RS","Serbia"],["RU","Rusia"],["RW","Ruanda"],["SA","Arabia Saudita"],["SB","Islas Salomón"],["SC","Seychelles"],["SD","Sudán"],["SE","Suecia"],["SG","Singapur"],["SH","Santa Elena"],["SI","Eslovenia"],["SJ","Svalbard y Jan Mayen"],["SK","Eslovaquia"],["SL","Sierra Leona"],["SM","San Marino"],["SN","Senegal"],["SO","Somalia"],["SR","Surinam"],["SS","Sudán del Sur"],["ST","Santo Tomé y Príncipe"],["SV","El Salvador"],["SX","Sint Maarten"],["SY","Siria"],["SZ","Suazilandia"],["TC","Islas Turcas y Caicos"],["TD","Chad"],["TF","Territorios Australes Franceses"],["TG","Togo"],["TH","Tailandia"],["TJ","Tayikistán"],["TK","Tokelau"],["TL","Timor Oriental"],["TM","Turkmenistán"],["TN","Túnez"],["TO","Tonga"],["TR","Turquía"],["TT","Trinidad y Tobago"],["TV","Tuvalu"],["TW","Taiwán"],["TZ","Tanzania"],["UA","Ucrania"],["UG","Uganda"],["UM","Islas menores alejadas de EE.UU."],["US","Estados Unidos"],["UY","Uruguay"],["UZ","Uzbekistán"],["VA","Ciudad del Vaticano"],["VC","San Vicente y las Granadinas"],["VE","Venezuela"],["VG","Islas Vírgenes Británicas"],["VI","Islas Vírgenes de EE.UU."],["VN","Vietnam"],["VU","Vanuatu"],["WF","Wallis y Futuna"],["WS","Samoa"],["YE","Yemen"],["YT","Mayotte"],["ZA","Sudáfrica"],["ZM","Zambia"],["ZW","Zimbabue"]
        ];

        function flagEmoji(cca2) {
            return String.fromCodePoint(...[...cca2.toUpperCase()].map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
        }

        const COUNTRIES = RAW.map(([cca2, nameEs]) => ({ cca2, nameEs, flag: flagEmoji(cca2) }));

        // Clasificación por continentes para los niveles
        const LATAM_AND_EUROPE = new Set([
            // América (Norte, Centro, Sur, Caribe)
            "AG","AI","AR","AW","BB","BL","BM","BO","BQ","BR","BS","BZ","CA","CL","CO","CR","CU","CW","DM","DO",
            "EC","FK","GD","GF","GL","GP","GS","GT","GY","HN","HT","JM","KN","KY","LC","MF","MQ","MS","MX","NI",
            "PA","PE","PM","PR","PY","SV","SX","TC","TT","US","UY","VC","VE","VG","VI",
            // Europa (incluyendo dependencias)
            "AD","AL","AT","AX","BA","BE","BG","BY","CH","CY","CZ","DE","DK","EE","ES","FI","FO","FR","GB","GG",
            "GI","GR","HR","HU","IE","IM","IS","IT","JE","LI","LT","LU","LV","MC","MD","ME","MK","MT","NL","NO",
            "PL","PT","RO","RS","RU","SE","SI","SJ","SK","SM","UA","VA"
        ]);

        const AFRICA_SET = new Set([
            "AO","BF","BI","BJ","BW","CD","CF","CG","CI","CM","CV","DJ","DZ","EG","EH","ER","ET","GA","GH","GM",
            "GN","GQ","GW","KE","KM","LR","LS","LY","MA","MG","ML","MR","MU","MW","MZ","NA","NE","NG","RE","RW",
            "SC","SD","SH","SL","SN","SO","SS","ST","SZ","TD","TG","TN","TZ","UG","YT","ZA","ZM","ZW"
        ]);

        // El resto (Asia, Oceanía, Antártida, territorios no clasificados) será el nivel difícil
        // No se define un set, se calcula como complemento

        let currentLevel = 'easy';
        let filteredCountries = [];
        let currentQuestion = null;
        let score = 0, total = 0, locked = false;
        let audioCtx = null;
        const app = document.getElementById('app');

        function getAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }
        function playSound(freqs, type='sine') {
            try {
                const ctx = getAudio(), t = ctx.currentTime;
                freqs.forEach((f,i) => {
                    const o = ctx.createOscillator(), g = ctx.createGain();
                    o.type = type; o.frequency.value = f;
                    g.gain.setValueAtTime(0.2, t+i*0.1);
                    g.gain.exponentialRampToValueAtTime(0.01, t+i*0.1+0.2);
                    o.connect(g); g.connect(ctx.destination);
                    o.start(t+i*0.1); o.stop(t+i*0.1+0.25);
                });
            } catch(e){}
        }
        const correctSound = ()=> playSound([523.25,659.25,783.99]);
        const wrongSound = ()=> playSound([200,100], 'sawtooth');

        function setFiltered() {
            if (currentLevel === 'easy') {
                filteredCountries = COUNTRIES.filter(c => LATAM_AND_EUROPE.has(c.cca2));
            } else if (currentLevel === 'normal') {
                filteredCountries = COUNTRIES.filter(c => AFRICA_SET.has(c.cca2));
            } else {
                // Difícil: todos los que no están en fácil ni normal
                filteredCountries = COUNTRIES.filter(c => !LATAM_AND_EUROPE.has(c.cca2) && !AFRICA_SET.has(c.cca2));
            }
        }

        function genQuestion() {
            if (filteredCountries.length < 4) return null;
            const correct = filteredCountries[Math.floor(Math.random() * filteredCountries.length)];
            const distractors = filteredCountries.filter(c => c.cca2 !== correct.cca2).sort(() => Math.random() - 0.5).slice(0, 3);
            return { correct, options: [correct, ...distractors].sort(() => Math.random() - 0.5) };
        }

        function handleAnswer(cca2, btn) {
            if (locked || !currentQuestion) return;
            locked = true;
            const isCorrect = cca2 === currentQuestion.correct.cca2;
            total++; if (isCorrect) score++;
            document.getElementById('corr').textContent = score;
            document.getElementById('tot').textContent = total;
            isCorrect ? correctSound() : wrongSound();
            document.querySelectorAll('.answer-btn').forEach(b => {
                b.disabled = true;
                if (b.dataset.cca2 === currentQuestion.correct.cca2) b.classList.add('correct');
                if (b === btn && !isCorrect) b.classList.add('wrong');
            });
            setTimeout(() => { locked = false; currentQuestion = genQuestion(); renderGame(); }, 1200);
        }

        function renderGame() {
            if (!currentQuestion) return;
            const { correct, options } = currentQuestion;
            app.innerHTML = `
                <div class="game-header">
                    <div class="header-left"><img src="logo.png" class="header-logo"><span class="title">Banderquiz</span></div>
                    <div class="scores"><span>⭐ <b id="corr">${score}</b></span><span>🎯 <b id="tot">${total}</b></span></div>
                    <button class="btn" id="resetBtn">🔄</button><button class="btn" id="backBtn">🏠</button>
                </div>
                <div class="game-card">
                    <div class="flag-container"><span class="flag-emoji">${correct.flag}</span></div>
                    <p style="color:var(--muted);">¿A qué país pertenece?</p>
                    <div class="answers-grid">${options.map(o => `<button class="answer-btn" data-cca2="${o.cca2}">${o.nameEs}</button>`).join('')}</div>
                </div>`;
            document.querySelectorAll('.answer-btn').forEach(b => b.addEventListener('click', e => handleAnswer(e.target.dataset.cca2, e.target)));
            document.getElementById('resetBtn').addEventListener('click', () => { score = total = 0; currentQuestion = genQuestion(); renderGame(); });
            document.getElementById('backBtn').addEventListener('click', showPortal);
        }

        function startGame(level) {
            currentLevel = level; score = total = 0;
            setFiltered();
            currentQuestion = genQuestion();
            renderGame();
        }

        function showPortal() {
            app.innerHTML = `
                <div class="portal">
                    <div class="logo-wrapper"><img src="logo.png" alt="Banderquiz" class="logo-img"></div>
                    <div class="hero-question">¿Cuántas banderas conoces?</div>
                    <div class="invite-line">🌟 elige tu desafío 🌟</div>
                    <div class="cards-grid">
                        <button class="level-card" data-level="easy">
                            <span class="level-emoji">🌎🌍</span>
                            <span class="level-name">Fácil</span>
                            <span class="level-desc">América y Europa</span>
                        </button>
                        <button class="level-card" data-level="normal">
                            <span class="level-emoji">🌍🐘</span>
                            <span class="level-name">Normal</span>
                            <span class="level-desc">África</span>
                        </button>
                        <button class="level-card" data-level="hard">
                            <span class="level-emoji">🌏🐉</span>
                            <span class="level-name">Difícil</span>
                            <span class="level-desc">Asia y Oceanía</span>
                        </button>
                    </div>
                    <p class="footer">🎌 pon a prueba tu mirada · aprende jugando</p>
                </div>`;
            document.querySelectorAll('.level-card').forEach(c => c.addEventListener('click', () => startGame(c.dataset.level)));
        }

        showPortal();
    </script>
</body>
</html>
